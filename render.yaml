services:
  - type: web
    name: channelrent-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPERADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: WEBHOOK_URL
        sync: false
      - key: USE_WEBHOOK
        value: "true"
      - key: BOT_USERNAME
        value: "Tele_marketplace_bot"
      - key: PLATFORM_NAME
        value: "ChannelRent"
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
